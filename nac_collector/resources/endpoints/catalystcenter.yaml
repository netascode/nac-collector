- name: assign_credentials
  import_id_no_descend: true
  # Provider import format is <site_id>,<id> where id == site_id: Create() sets
  # plan.Id = plan.SiteId, so both segments are the SAME site UUID. The doubled
  # `field: siteId` below is intentional (NOT a copy-paste error).
  import_id_attributes:
  - field: siteId
  - field: siteId
  import_id_key:
    join:
    - site_hierarchy: siteId
  endpoint: /api/v1/commonsetting/global
