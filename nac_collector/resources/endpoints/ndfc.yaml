- name: MSD_Fabric_Associations
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/fabrics/msd/fabric-associations
- name: Fabric_Configuration
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/fabrics/%v
- name: Discovered_Switches
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/fabrics/%v/inventory
  children:
  - name: manage_interfaces
    endpoint: /api/v1/manage/fabrics/%v/switches/{{serialNumber}}/interfaces?configOnly=true
- name: TorPairing
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/tor/fabrics/%v/switches/{{leafSerialNumber}}
- name: Switch_Credentials
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/lanConfig/getLanSwitchCredentials
- name: VPC_Pairs
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/vpcpair?navId={{fabricID}}
  children:
  - name: VPC_PeerLinkSettings
    endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/vpcpair/recommendation?serialNumber={{peerOneId}}
- name: Fabric_Resources
  endpoint: /api/v1/manage/fabrics/%v/resources
- name: Fabric_Links
  endpoint: /api/v1/manage/links?fabricName=%v
- name: Policies
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/policies/pagination?fabricName=%v
- name: VRF_Configuration
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/%v/vrfs
  children:
  - name: VRF_Attachments
    endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/%v/vrfs/attachments?vrf-names={{vrf_name}}
  # MSD root only: each VXLAN member fabric's copy of the VRFs (per-site settings,
  # NAC vxlan.multisite.overlay.vrfs[].child_fabrics); nested into the root VRFs.
  - name: VRF_Child_Fabric_Configuration
    endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/{{child_fabric}}/vrfs
- name: Network_Configuration
  endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/%v/networks
  children:
  - name: Network_Attachments
    endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/%v/networks/{{network_name}}/attachments
  # MSD root only: each VXLAN member fabric's copy of the networks (per-site settings,
  # NAC vxlan.multisite.overlay.networks[].child_fabrics); nested into the root networks.
  - name: Network_Child_Fabric_Configuration
    endpoint: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/top-down/fabrics/{{child_fabric}}/networks
