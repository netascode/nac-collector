# Intersight endpoints for nac-compute resource collection.
# Each entry maps a nac-compute resource key to its Intersight REST API path.
# The optional `filter` field is appended as ?$filter=<value> (URL-encoded by the controller).

- name: organization
  endpoint: /api/v1/organization/Organizations

# --- Pools ---

- name: ip_pool
  endpoint: /api/v1/ippool/Pools

- name: iqn_pool
  endpoint: /api/v1/iqnpool/Pools

- name: mac_pool
  endpoint: /api/v1/macpool/Pools

- name: resource_pool
  endpoint: /api/v1/resourcepool/Pools

- name: uuid_pool
  endpoint: /api/v1/uuidpool/Pools

- name: wwnn_pool
  endpoint: /api/v1/fcpool/Pools
  filter: PoolPurpose eq 'WWNN'

- name: wwpn_pool
  endpoint: /api/v1/fcpool/Pools
  filter: PoolPurpose eq 'WWPN'

