# Extra manually-defined endpoints and overrides
# for endpoints generated from provider definitions.
#
# To apply modifications in this file,
# regenerate the endpoints YAML with "uv run ./scripts/update_endpoints.py".

# Endpoints to remove from the generated file
# (duplicates, endpoints replaced by unified versions, or not needed)
remove_endpoints:
- areas
- buildings
- floors
- anycast_gateways
- fabric_devices
- fabric_multicast_virtual_networks
- provision_devices
- provision_device
- ap_profile
- apply_pending_fabric_events
- device
- discovery
- dot11be_profile
- extranet_policy
- fabric_multicast_virtual_network
- global_credential_netconf
- integrate_ise
- wireless_profile_site_tag
- assign_templates_to_tag

# Extra endpoints not present in the Terraform provider definitions
extra_endpoints:
- name: site
  endpoint: /dna/intent/api/v1/sites
  children:
  - name: aaa_settings
    endpoint: /aaaSettings?_inherited=true
    import_id_attributes:
    - source: parent
  - name: banner_settings
    endpoint: /bannerSettings
  - name: dhcp_settings
    endpoint: /dhcpSettings
  - name: dns_settings
    endpoint: /dnsSettings
  - name: ntp_settings
    endpoint: /ntpSettings
  - name: telemetry_settings
    endpoint: /telemetrySettings?_inherited=true
  - name: timezone_settings
    endpoint: /timeZoneSettings
  - name: wireless_ssid
    endpoint: /wirelessSettings/ssids
    import_id_attributes:
    - source: parent
    - field: id

- name: network
  endpoint: /api/v1/commonsetting/global

- name: network_devices
  endpoint: /dna/intent/api/v1/network-device

- name: wireless_controller_primary_managed_ap_locations
  endpoint: /dna/intent/api/v1/wirelessControllers/%v/primaryManagedApLocations

- name: wireless_controller_secondary_managed_ap_locations
  endpoint: /dna/intent/api/v1/wirelessControllers/%v/secondaryManagedApLocations

- name: device_detail
  endpoint: /dna/intent/api/v1/device-detail

- name: fabric_authentication_profile
  endpoint: /dna/intent/api/v1/business/sda/authentication-profile

- name: fabric_provision_device
  endpoint: /dna/intent/api/v1/sda/provisionDevices
  import_id_attributes:
  - field: siteId

- name: fabric_sites
  endpoint: /dna/intent/api/v1/sda/fabricSites

- name: fabric_virtual_network
  endpoint: /dna/intent/api/v1/virtual-network

- name: ip_pools
  endpoint: /dna/intent/api/v1/ipam/globalIpAddressPools

- name: virtual_network_ip_pool
  endpoint: /dna/intent/api/v1/business/sda/virtualnetwork/ippool

- name: wireless_enterprise_ssid
  endpoint: /dna/intent/api/v1/enterprise-ssid

- name: extended_templates
  endpoint: /api/v1/template-programmer/extendedTemplates

- name: vlanToSsids
  endpoint: /dna/intent/api/v1/sda/fabrics/%v/vlanToSsids

- name: site_settings
  endpoint: /api/v1/commonsetting/global

- name: network_profile
  endpoint: /api/v1/siteprofile?populated=true
  import_id_attributes:
  - field: siteProfileUuid

- name: fabric_multicast_virtual_network
  endpoint: /dna/intent/api/v1/sda/multicast/virtualNetworks

# Endpoint overrides format:
# A flat list of endpoints (no tree with "children").
#   "name" refers to an endpoint anywhere in the main endpoint tree.
#   "parent_endpoint" (a path: list of URLs of parent endpoints)
#     moves the endpoint to a different parent.
#   Any other keys replace the corresponding keys in the endpoint.
overrides:
- name: area
  endpoint: /dna/intent/api/v2/site

- name: building
  endpoint: /dna/intent/api/v2/site

- name: floor
  endpoint: /api/v1/dna-maps-service/domains

- name: image
  endpoint: /dna/intent/api/v1/image/importation

- name: ip_pool
  endpoint: /api/v2/ippool
  import_id_attributes:
    - field: id

- name: ip_pool_reservation
  endpoint: /dna/intent/api/v1/reserve-ip-subpool?ignoreInheritedGroups=true&limit=500
  import_id_attributes:
    - field: id

- name: project
  endpoint: /dna/intent/api/v2/template-programmer/project
  import_id_attributes:
    - field: id

- name: template
  endpoint: /dna/intent/api/v2/template-programmer/template
  # provider import.sh format: <project_id>,<id>
  import_id_attributes:
    - field: projectId
    - field: id

- name: transit_network
  import_id_attributes:
    - field: name

- name: fabric_port_assignments
  import_id_attributes:
    - field: fabricId
    - field: networkDeviceId

- name: template_version
  import_id_attributes:
    - field: templateId

- name: wireless_profile
  endpoint: /intent/api/v1/wirelessProfiles

- name: assign_devices_to_tag
  endpoint: /member?memberType=networkdevice

# Import-ID key recipes (issue #509 keyed-import layer).
# Authored here — NOT in the generated endpoints file — so a full endpoint
# regeneration re-injects them (applied by apply_import_ids, matched by name,
# recurses into children). The value builder derives the composite import id
# from import_id_attributes; this key selects the natural key the plan indexes on.
import_ids:
- name: anycast_gateway
  import_id_key:
    field: ipPoolName
- name: area
  import_id_key:
    field: groupNameHierarchy
- name: assign_credentials
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: assign_device_to_site
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: tag
  import_id_key:
    field: name
- name: building
  import_id_key:
    field: groupNameHierarchy
- name: credentials_cli
  import_id_key:
    group: cliCredential
    key_field: description
- name: credentials_https_read
  import_id_key:
    group: httpsRead
    key_field: description
- name: credentials_https_write
  import_id_key:
    group: httpsWrite
    key_field: description
- name: credentials_snmpv2_read
  import_id_key:
    group: snmpV2cRead
    key_field: description
- name: credentials_snmpv2_write
  import_id_key:
    group: snmpV2cWrite
    key_field: description
- name: credentials_snmpv3
  import_id_key:
    group: snmpV3
    key_field: description
- name: external_authentication_aaa_attribute
  import_id_key:
    field: attributeName
- name: fabric_device
  import_id_key:
    join:
    - device_hostname: networkDeviceId
- name: fabric_l2_handoff
  import_id_key:
    join:
    - field: externalVlanId
    - device_hostname: networkDeviceId
    - field: interfaceName
    sep: /
- name: fabric_l2_virtual_network
  import_id_key:
    join:
    - field: associatedLayer3VirtualNetworkName
    - site_hierarchy: fabricId
    sep: '#_#'
- name: fabric_l3_handoff_ip_transit
  import_id_key:
    join:
    - device_hostname: networkDeviceId
- name: fabric_l3_handoff_sda_transit
  import_id_key:
    join:
    - device_hostname: networkDeviceId
- name: fabric_l3_virtual_network
  import_id_key:
    field: virtualNetworkName
- name: virtual_network_to_fabric_site
  import_id_key:
    field: virtualNetworkName
- name: fabric_port_assignments
  import_id_key:
    join:
    - device_hostname: networkDeviceId
- name: fabric_provision_device
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: fabric_site
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: fabric_zone
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: ip_pool_reservation
  import_id_key:
    field: groupName
# network_profile has match_id on `name`, but its definition is no_read: true, so a
# regeneration filters it out as an endpoint node and auto-derivation has nothing to
# attach to. Kept here so the key survives regen (the node is re-added downstream).
- name: network_profile
  import_id_key:
    field: name
- name: project
  import_id_key:
    field: name
- name: role
  import_id_key:
    group: roles
    key_field: role
- name: aaa_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: banner_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: dhcp_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: dns_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: ntp_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: telemetry_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: timezone_settings
  import_id_key:
    join:
    - site_hierarchy: id
- name: sp_profile
  import_id_key:
    field: spProfileName
- name: template
  import_id_key:
    field: name
- name: template_version
  import_id_key:
    field: name
- name: transit_network
  import_id_key:
    field: name
- name: update_authentication_profile
  import_id_key:
    join:
    - site_hierarchy: fabricId
    - field: authenticationProfileName
    sep: '#_#'
- name: user
  import_id_key:
    group: users
    key_field: username
- name: vlanToSsids
  import_id_key:
    join:
    - site_hierarchy: siteId
- name: wireless_cleanair_configuration
  import_id_key:
    field: designName
- name: wireless_enterprise_ssid
  import_id_key:
    field: ssidName
- name: wireless_interface
  import_id_key:
    field: interfaceName
- name: wireless_profile
  import_id_key:
    field: wirelessProfileName
- name: wireless_rf_profile
  import_id_key:
    field: rfProfileName
- name: wireless_rrm_fra_configuration
  import_id_key:
    field: designName
